name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: false
        default: 'none'
        type: choice
        options:
          - none
          - patch
          - minor
          - major
      dry_run:
        description: 'Dry run (build only, no release)'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  bump-version:
    if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.bump.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags --force

      - name: Get latest tag and bump version
        id: bump
        env:
          BUMP_TYPE: ${{ inputs.bump }}
        run: |
          LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $LATEST"

          VERSION="${LATEST#v}"
          MAJOR="${VERSION%%.*}"
          REST="${VERSION#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST#*.}"

          if [ "$PATCH" = "$REST" ]; then
            PATCH="0"
          fi

          case "$BUMP_TYPE" in
            major) NEW_TAG="v$((MAJOR + 1)).0.0" ;;
            minor) NEW_TAG="v${MAJOR}.$((MINOR + 1)).0" ;;
            patch) NEW_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
          esac

          echo "Bumping $LATEST -> $NEW_TAG ($BUMP_TYPE)"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        env:
          NEW_TAG: ${{ steps.bump.outputs.new_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"

  goreleaser:
    needs: [bump-version]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.bump-version.outputs.new_tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--snapshot --clean' || '--clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCOOP_TOKEN: ${{ secrets.SCOOP_TOKEN }}

  # Homebrew bottles (darwin_amd64 + darwin_arm64).
  # GoReleaser's `brews` block publishes a formula that downloads release
  # tarballs, but Homebrew still treats non-bottled installs as "builds" and
  # gates them on an up-to-date CLT. True bottles let `brew` pour binaries and
  # skip that path. GoReleaser OSS has no bottle generator — this job builds
  # bottles on macOS runners after the formula lands in JordanCoin/homebrew-tap.
  #
  # Requires: SCOOP_TOKEN (or HOMEBREW_TAP_TOKEN) with write access to the tap,
  # plus permissions to upload bottle artifacts to a tap release.
  # Enable by setting secrets and flipping `if` to run on real (non-dry-run) releases.
  bottles:
    name: Homebrew bottles
    needs: [goreleaser]
    if: false # set true once tap token + bottle root_url are ready (see issue #1)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-13
            arch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Build bottle
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: |
          set -euo pipefail
          brew update
          brew tap JordanCoin/tap
          brew uninstall --force docmap || true
          # Formula already points at GitHub release binaries; --build-bottle
          # still produces a pourable bottle that skips the CLT build gate.
          brew install --build-bottle jordancoin/tap/docmap
          brew bottle --json --no-rebuild jordancoin/tap/docmap
          ls -la *.bottle.*

      - uses: actions/upload-artifact@v4
        with:
          name: docmap-bottle-${{ matrix.arch }}
          path: |
            *.bottle.tar.gz
            *.bottle.json
          if-no-files-found: error

  # After both arch bottles exist: download artifacts, brew bottle --merge --write,
  # commit bottle do { ... } into homebrew-tap/docmap.rb, and upload .bottle.tar.gz
  # files to a JordanCoin/homebrew-tap release whose tag matches bottle root_url.
  # Keep this as a follow-up job once the matrix above is enabled (issue #1).
